name: Build SambhavAI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK and local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew || true
          mkdir -p /home/runner/.android
          touch /home/runner/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload SambhavAI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SambhavAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
