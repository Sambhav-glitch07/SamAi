name: Build SambhavAI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Determine Project Root
        id: check_dir
        run: |
          if [ -f "SambhavAI/gradlew" ]; then
            echo "project_dir=SambhavAI" >> $GITHUB_OUTPUT
          elif [ -f "gradlew" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          else
            echo "project_dir=SambhavAI" >> $GITHUB_OUTPUT
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x ${{ steps.check_dir.outputs.project_dir }}/gradlew || true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: |
          cd ${{ steps.check_dir.outputs.project_dir }}
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Could not locate debug APK file!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload SambhavAI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SambhavAI-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
